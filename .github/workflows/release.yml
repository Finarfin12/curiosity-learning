name: Release

# Pushing a version tag (for example 0.5.0, no "v" prefix) builds the plugin from that exact commit, runs the tests,
# creates GitHub artifact attestations for the release files and publishes the release.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check that the tag matches manifest.json, package.json and versions.json
        run: |
          v="${GITHUB_REF_NAME}"
          test "$(node -p "require('./manifest.json').version")" = "$v"
          test "$(node -p "require('./package.json').version")" = "$v"
          test "$(node -p "require('./package-lock.json').version")" = "$v"
          test "$(node -p "require('./versions.json')['$v'] || ''")" = "$(node -p "require('./manifest.json').minAppVersion")"
          grep -q "^## $v\$" CHANGELOG.md

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check release files
        run: |
          for f in main.js manifest.json styles.css; do [ -s "$f" ] || { echo "Missing release asset $f"; exit 1; }; done

      - name: Attest release files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v v="${GITHUB_REF_NAME}" '$0 == "## " v {f=1; next} /^## / {f=0} f' CHANGELOG.md > release-notes.md
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" --notes-file release-notes.md --verify-tag
